const { useState, useEffect, useMemo } = React;

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Error capturado:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: "100vh", background: "#08090B", color: "#E6E8EC", display: "flex",
          flexDirection: "column", alignItems: "center", justifyContent: "center", fontFamily: "sans-serif",
          padding: 24, textAlign: "center", gap: 14 }}>
          <div style={{ fontSize: 15 }}>Algo no cargo bien. Tus datos guardados siguen a salvo.</div>
          <button onClick={() => window.location.reload()} style={{ background: "#4C7EDB", color: "#0A0E16",
            border: "none", borderRadius: 10, padding: "10px 20px", fontWeight: 600, cursor: "pointer", fontSize: 14 }}>
            Recargar
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ============ TU SEMANA (plan por defecto — puedes reordenarla en la app) ============
const PLAN_DEFAULT = {

};

// ============ STRAVA — misma app que ya usa Runner (mismo dominio, mismo Client ID) ============
const STRAVA_CLIENT_ID = "273128";
const STRAVA_CLIENT_SECRET = "d6c812b645e4d0c62d0587c3cc2f4b0cdbd28c55";
// Tipos de actividad de Strava que cuentan como "fuerza" (se excluye correr, ciclismo, nadar, etc.)
const STRAVA_TIPOS_FUERZA = ["WeightTraining", "Workout", "Crossfit"];

// ============ GOOGLE DRIVE — ID de cliente ya configurado, no es secreto ============
const GDRIVE_CLIENT_ID_DEFAULT = "1005268713457-e4qphu803fs0u6djc7k632pjb38k3oka.apps.googleusercontent.com";

const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

const STORAGE_KEY = "fierro-data-v2"; // misma llave: tu historial se conserva

// Adaptador de almacenamiento: usa window.storage (entorno de Claude) si existe;
// en hosting externo (GitHub Pages, Vercel, etc.) usa localStorage del navegador.
// Adaptador de almacenamiento: localStorage es SIEMPRE la base confiable
// (funciona igual en GitHub Pages, Opera, o dentro de Claude). Si además existe
// window.storage (solo dentro de Claude), se usa como copia extra, pero si esa
// API interna falla, nunca bloquea ni rompe el guardado real en localStorage.
const storage = {
  async get(k) {
    try {
      const v = localStorage.getItem(k);
      if (v !== null) return { value: v };
    } catch (e) { /* localStorage no disponible en este navegador */ }
    if (typeof window !== "undefined" && window.storage) {
      try { return await window.storage.get(k); } catch (e) { /* sin datos previos ahí tampoco */ }
    }
    throw new Error("sin datos previos");
  },
  async set(k, v) {
    let guardadoOk = false;
    try { localStorage.setItem(k, v); guardadoOk = true; } catch (e) { /* localStorage no disponible */ }
    if (typeof window !== "undefined" && window.storage) {
      try { await window.storage.set(k, v); guardadoOk = true; } catch (e) { /* falla silenciosa, no crítica */ }
    }
    if (!guardadoOk) throw new Error("No hay almacenamiento disponible en este navegador");
    return { key: k, value: v };
  },
};
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hoyISO = () => iso(new Date());
const fechaBonita = (s) => new Date(s + "T12:00:00").toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" });
const fechaCorta = (s) => new Date(s + "T12:00:00").toLocaleDateString("es-MX", { day: "numeric", month: "short" });
const diaCorta = (s) => new Date(s + "T12:00:00").toLocaleDateString("es-MX", { weekday: "short", day: "numeric" });

// "20 ago, 08:18 a.m." — fecha y hora exactas de la última sincronización
const fechaHoraCorta = (isoDateTime) => {
  if (!isoDateTime) return "";
  return new Date(isoDateTime).toLocaleString("es-MX", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
};

// Semanas del MES en curso, en bloques de 7 días (1-7, 8-14, ...).
// Se recalcula solo con año/mes reales: al cambiar de mes, cambia sola.
function semanasDelMes(anio, mes) {
  const ultimoDia = new Date(anio, mes + 1, 0).getDate();
  const semanas = [];
  for (let inicio = 1; inicio <= ultimoDia; inicio += 7) {
    const fin = Math.min(inicio + 6, ultimoDia);
    const dias = [];
    for (let d = inicio; d <= fin; d++) dias.push(`${anio}-${String(mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
    semanas.push({ dias });
  }
  return semanas;
}

function ModoBestia() {
  const [tab, setTab] = useState("hoy");
  const [data, setData] = useState({ pesoCorporal: [], diasMarcados: [], plan: PLAN_DEFAULT, planVersion: PLAN_VERSION, planOverrides: {}, strava: { accessToken: null, refreshToken: null, expiresAt: null, ultimaSync: null }, stravaActividades: [], metaPeso: { kg: 82, fecha: "2026-12-31" } });
  const [drag, setDrag] = useState(null); // {from, y0} para reordenar la semana
  const [cargado, setCargado] = useState(false);
  const [pesoInput, setPesoInput] = useState("");
  const [fechaPeso, setFechaPeso] = useState(hoyISO());
  const [mensaje, setMensaje] = useState(null);
  const [mesCal, setMesCal] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [sincronizando, setSincronizando] = useState(false);
  const [semanaSel, setSemanaSel] = useState(() => Math.floor((new Date().getDate() - 1) / 7));
  const [editandoMeta, setEditandoMeta] = useState(false);
  const [metaKgInput, setMetaKgInput] = useState("82");
  const [metaFechaInput, setMetaFechaInput] = useState("2026-12-31");
  const [gdriveClientId, setGdriveClientId] = useState(() => {
    try {
      const v = (localStorage.getItem("gdrive_client_id") || "").trim();
      return v || GDRIVE_CLIENT_ID_DEFAULT;
    } catch (e) { return GDRIVE_CLIENT_ID_DEFAULT; }
  });
  const [configurandoDrive, setConfigurandoDrive] = useState(false);
  const [gdriveInput, setGdriveInput] = useState("");
  const [guardandoDrive, setGuardandoDrive] = useState(false);
  const diaSemanaHoy = new Date().getDay();

  useEffect(() => {
    (async () => {
      let dataInicial = null;
      try {
        const r = await storage.get(STORAGE_KEY);
        if (r && r.value) {
          const d = JSON.parse(r.value);
          const versionGuardada = d.planVersion || 0;
          const planFinal = versionGuardada < PLAN_VERSION ? { ...PLAN_DEFAULT } : { ...PLAN_DEFAULT, ...(d.plan || {}) };
          dataInicial = {
            pesoCorporal: d.pesoCorporal || [],
            diasMarcados: d.diasMarcados || [],
            plan: planFinal,
            planVersion: PLAN_VERSION,
            planOverrides: d.planOverrides && typeof d.planOverrides === "object" ? d.planOverrides : {},
            strava: d.strava && typeof d.strava === "object" ? d.strava : { accessToken: null, refreshToken: null, expiresAt: null, ultimaSync: null },
            stravaActividades: Array.isArray(d.stravaActividades) ? d.stravaActividades : [],
            metaPeso: d.metaPeso && typeof d.metaPeso === "object" ? d.metaPeso : { kg: 82, fecha: "2026-12-31" },
          };
        }
      } catch (e) { /* primera vez */ }

      // ¿Strava nos acaba de regresar aquí con un código de autorización?
      const codeParam = new URLSearchParams(window.location.search).get("code");
      if (codeParam) {
        window.history.replaceState(null, "", window.location.pathname);
        if (!dataInicial) dataInicial = { pesoCorporal: [], diasMarcados: [], plan: { ...PLAN_DEFAULT }, planVersion: PLAN_VERSION, planOverrides: {}, strava: { accessToken: null, refreshToken: null, expiresAt: null, ultimaSync: null }, stravaActividades: [], metaPeso: { kg: 82, fecha: "2026-12-31" } };
        setMensaje("Conectando con Strava...");
        setData(dataInicial);
        setCargado(true);
        await exchangeStravaCode(codeParam, dataInicial);
        return;
      }

      if (dataInicial) setData(dataInicial);
      setCargado(true);

      // Sincronización silenciosa: si ya hay conexión guardada, jala lo nuevo sin pedir nada.
      if (dataInicial && dataInicial.strava && dataInicial.strava.refreshToken) {
        sincronizarStrava(dataInicial);
      }
    })();
  }, []);

  const guardar = async (nueva) => {
    setData(nueva);
    try { await storage.set(STORAGE_KEY, JSON.stringify(nueva)); }
    catch (e) { console.error("No se pudo guardar", e); }
  };

  // ---------- rachas ----------
  const rachas = useMemo(() => {
    const set = new Set(data.diasMarcados);
    let actual = 0;
    const d = new Date();
    if (!set.has(iso(d))) d.setDate(d.getDate() - 1);
    while (set.has(iso(d))) { actual++; d.setDate(d.getDate() - 1); }
    const orden = [...set].sort();
    let mejor = 0, run = 0, prev = null;
    for (const f of orden) {
      if (prev) {
        const p = new Date(prev + "T12:00:00"); p.setDate(p.getDate() + 1);
        run = iso(p) === f ? run + 1 : 1;
      } else run = 1;
      mejor = Math.max(mejor, run);
      prev = f;
    }
    const mesStr = `${mesCal.y}-${String(mesCal.m + 1).padStart(2, "0")}`;
    const esteMes = data.diasMarcados.filter((f) => f.startsWith(mesStr)).length;
    let ult7 = 0;
    for (let i = 0; i < 7; i++) { const x = new Date(); x.setDate(x.getDate() - i); if (set.has(iso(x))) ult7++; }
    return { actual, mejor, esteMes, total: set.size, ult7 };
  }, [data.diasMarcados, mesCal]);

  // ---------- estadísticas de peso ----------
  const pesoStats = useMemo(() => {
    const p = data.pesoCorporal;
    if (p.length === 0) return null;
    const inicio = p[0], actual = p[p.length - 1];
    const total = (actual.kg - inicio.kg).toFixed(1);
    const previo = p.length >= 2 ? (actual.kg - p[p.length - 2].kg).toFixed(1) : null;
    const min = Math.min(...p.map((x) => x.kg));
    return { inicio, actual, total, previo, min };
  }, [data.pesoCorporal]);

  // ---------- estadísticas mensuales y del regreso ----------
  const estad = useMemo(() => {
    const mesesSet = new Set();
    data.diasMarcados.forEach((f) => mesesSet.add(f.slice(0, 7)));
    data.pesoCorporal.forEach((p) => mesesSet.add(p.fecha.slice(0, 7)));
    const meses = [...mesesSet].sort();

    const porMes = meses.map((m) => {
      const dias = data.diasMarcados.filter((f) => f.startsWith(m)).length;
      const pesos = data.pesoCorporal.filter((p) => p.fecha.startsWith(m)).map((p) => p.kg);
      const prom = pesos.length ? pesos.reduce((a, b) => a + b, 0) / pesos.length : null;
      return { mes: m, dias, prom };
    });

    // cambio de peso vs el mes anterior con datos (usando promedios: la tendencia real)
    let prev = null;
    porMes.forEach((x) => {
      if (x.prom != null) { x.cambio = prev != null ? x.prom - prev : null; prev = x.prom; }
      else x.cambio = null;
    });

    const conDias = porMes.filter((x) => x.dias > 0);
    const mejorMes = conDias.length ? conDias.reduce((a, b) => (b.dias >= a.dias ? b : a)) : null;
    const maxDias = Math.max(1, ...porMes.map((x) => x.dias));

    // ritmo y constancia desde el primer día marcado
    const marcados = [...data.diasMarcados].sort();
    let ritmo = null, constancia = null, diasDesde = null;
    if (marcados.length) {
      const desde = new Date(marcados[0] + "T12:00:00");
      diasDesde = Math.max(1, Math.round((new Date() - desde) / 86400000) + 1);
      ritmo = (data.diasMarcados.length / diasDesde) * 7;
      constancia = (data.diasMarcados.length / diasDesde) * 100;
    }

    // ritmo de cambio de peso por semana
    let ritmoPeso = null;
    if (data.pesoCorporal.length >= 2) {
      const a = data.pesoCorporal[0], b = data.pesoCorporal[data.pesoCorporal.length - 1];
      const sem = Math.max(1, (new Date(b.fecha) - new Date(a.fecha)) / 86400000 / 7);
      ritmoPeso = (b.kg - a.kg) / sem;
    }

    return { porMes, mejorMes, maxDias, ritmo, constancia, ritmoPeso, diasDesde };
  }, [data]);

  const mesLabel = (m) => `${MESES[parseInt(m.slice(5, 7), 10) - 1].slice(0, 3)} ${m.slice(2, 4)}`;

  // ---------- proyección hacia la meta de peso ----------
  const metaProyeccion = useMemo(() => {
    if (!pesoStats || !data.metaPeso) return null;
    const faltan = Number((pesoStats.actual.kg - data.metaPeso.kg).toFixed(1)); // positivo = falta bajar
    const hoy = new Date();
    const fechaMeta = new Date(data.metaPeso.fecha + "T12:00:00");
    const semanasRestantes = Math.max(0.1, (fechaMeta - hoy) / (1000 * 60 * 60 * 24 * 7));
    const ritmoNecesario = faltan / semanasRestantes;
    let fechaProyectada = null;
    if (estad.ritmoPeso != null && estad.ritmoPeso < 0 && faltan > 0) {
      const semanasParaLlegar = faltan / Math.abs(estad.ritmoPeso);
      const f = new Date();
      f.setDate(f.getDate() + Math.round(semanasParaLlegar * 7));
      fechaProyectada = f;
    }
    return { faltan, semanasRestantes, ritmoNecesario, fechaProyectada };
  }, [pesoStats, data.metaPeso, estad.ritmoPeso]);

  // ---------- historial de peso solo de lunes ----------
  const historialLunes = data.pesoCorporal.filter((p) => new Date(p.fecha + "T12:00:00").getDay() === 1);

  // ---------- acciones ----------
  const hoyMarcado = data.diasMarcados.includes(hoyISO());

  const toggleDiaCal = async (fecha) => {
    if (fecha > hoyISO()) return;
    const marcados = data.diasMarcados.includes(fecha)
      ? data.diasMarcados.filter((f) => f !== fecha)
      : [...data.diasMarcados, fecha];
    await guardar({ ...data, diasMarcados: marcados });
  };

  const registrarPeso = async () => {
    const kg = parseFloat(pesoInput);
    if (!kg || kg <= 0 || !fechaPeso || fechaPeso > hoyISO()) return;
    const sinFecha = data.pesoCorporal.filter((p) => p.fecha !== fechaPeso);
    const lista = [...sinFecha, { fecha: fechaPeso, kg }].sort((a, b) => a.fecha.localeCompare(b.fecha));
    await guardar({ ...data, pesoCorporal: lista });
    setPesoInput("");
    const dif = lista.length >= 2 ? (lista[lista.length - 1].kg - lista[0].kg).toFixed(1) : null;
    setMensaje(dif && dif < 0 ? `Registrado. Ya son ${Math.abs(dif)} kg menos desde el inicio — la báscula dice que vas ganando.`
      : "Peso registrado con fecha exacta. La tendencia es lo que importa.");
    setTimeout(() => setMensaje(null), 5000);
  };

  const borrarPeso = async (fecha) => {
    await guardar({ ...data, pesoCorporal: data.pesoCorporal.filter((p) => p.fecha !== fecha) });
  };

  const guardarMeta = async () => {
    const kg = parseFloat(metaKgInput);
    if (!kg || kg <= 0 || !metaFechaInput) return;
    await guardar({ ...data, metaPeso: { kg, fecha: metaFechaInput } });
    setEditandoMeta(false);
    setMensaje("Meta actualizada.");
    setTimeout(() => setMensaje(null), 3000);
  };

  // ---------- Strava (mismo patrón que ya funciona en Runner) ----------
  const conectarStrava = () => {
    const redirectUri = window.location.origin + window.location.pathname;
    const url = `https://www.strava.com/oauth/authorize?client_id=${STRAVA_CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&approval_prompt=auto&scope=activity:read_all`;
    window.location.href = url;
  };

  // Strava nos regresó con ?code=... — lo cambiamos por tokens y arrancamos el primer sync.
  const exchangeStravaCode = async (code, dataBase) => {
    try {
      const res = await fetch("https://www.strava.com/oauth/token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          client_id: STRAVA_CLIENT_ID,
          client_secret: STRAVA_CLIENT_SECRET,
          code,
          grant_type: "authorization_code",
        }),
      });
      if (!res.ok) throw new Error("token exchange failed");
      const tok = await res.json();
      const nuevo = {
        ...dataBase,
        strava: { accessToken: tok.access_token, refreshToken: tok.refresh_token, expiresAt: tok.expires_at, ultimaSync: null },
      };
      await guardar(nuevo);
      setMensaje("Strava conectado. Sincronizando tus entrenamientos de fuerza...");
      setTimeout(() => setMensaje(null), 4000);
      await sincronizarStrava(nuevo);
    } catch (e) {
      console.error("Error al conectar con Strava:", e);
      setMensaje("No se pudo conectar con Strava. Intenta de nuevo.");
      setTimeout(() => setMensaje(null), 4000);
    }
  };

  // Renueva el token si está por vencer (Strava los vence cada 6 horas) y
  // trae actividades nuevas de fuerza — todo en silencio. Solo marca los DÍAS
  // (diasMarcados, la misma fuente que racha/estadísticas); el MÚSCULO mostrado
  // sigue viniendo de tu plan (Strava no sabe qué músculo entrenaste).
  const sincronizarStrava = async (dataBase) => {
    const base = dataBase || data;
    if (!base.strava || !base.strava.refreshToken) return;
    setSincronizando(true);
    try {
      let accessToken = base.strava.accessToken;
      let refreshToken = base.strava.refreshToken;
      let expiresAt = base.strava.expiresAt;

      const nowSec = Math.floor(Date.now() / 1000);
      if (!expiresAt || expiresAt - nowSec <= 300) {
        const resRefresh = await fetch("https://www.strava.com/oauth/token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            client_id: STRAVA_CLIENT_ID,
            client_secret: STRAVA_CLIENT_SECRET,
            refresh_token: refreshToken,
            grant_type: "refresh_token",
          }),
        });
        if (!resRefresh.ok) throw new Error("No se pudo renovar el acceso a Strava");
        const tok = await resRefresh.json();
        accessToken = tok.access_token;
        refreshToken = tok.refresh_token || refreshToken;
        expiresAt = tok.expires_at;
      }

      const despuesDe = base.strava.ultimaSync
        ? Math.floor(new Date(base.strava.ultimaSync).getTime() / 1000) - 86400
        : Math.floor(Date.now() / 1000) - 90 * 86400;
      const resAct = await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${despuesDe}&per_page=100`, {
        headers: { Authorization: `Bearer ${accessToken}` },
      });
      if (!resAct.ok) throw new Error("No se pudieron traer las actividades");
      const actividades = await resAct.json();

      const actsFuerza = (Array.isArray(actividades) ? actividades : [])
        .filter((a) => STRAVA_TIPOS_FUERZA.includes(a.type || a.sport_type));

      const fechasFuerza = actsFuerza
        .map((a) => (a.start_date_local || a.start_date || "").slice(0, 10))
        .filter(Boolean);

      // Guarda duración y esfuerzo (si Strava lo reporta) por actividad, sin duplicar por id.
      const nuevasDetalladas = actsFuerza.map((a) => ({
        id: a.id,
        fecha: (a.start_date_local || a.start_date || "").slice(0, 10),
        minutos: a.moving_time ? Math.round(a.moving_time / 60) : null,
        esfuerzo: typeof a.suffer_score === "number" ? a.suffer_score : null,
        hr: typeof a.average_heartrate === "number" ? Math.round(a.average_heartrate) : null,
      })).filter((a) => a.id && a.fecha);
      const idsExistentes = new Set((base.stravaActividades || []).map((a) => a.id));
      const stravaActividades = [...(base.stravaActividades || []), ...nuevasDetalladas.filter((a) => !idsExistentes.has(a.id))];

      const nuevo = {
        ...base,
        diasMarcados: [...new Set([...base.diasMarcados, ...fechasFuerza])],
        stravaActividades,
        strava: { accessToken, refreshToken, expiresAt, ultimaSync: new Date().toISOString() },
      };
      await guardar(nuevo);
      if (fechasFuerza.length) {
        setMensaje(`Strava sincronizado: ${fechasFuerza.length} entrenamiento${fechasFuerza.length === 1 ? "" : "s"} de fuerza detectado${fechasFuerza.length === 1 ? "" : "s"}.`);
        setTimeout(() => setMensaje(null), 5000);
      }
    } catch (e) {
      console.error("Error al sincronizar con Strava:", e);
      setMensaje("No se pudo sincronizar con Strava ahora. Se reintenta la próxima vez que abras la app.");
      setTimeout(() => setMensaje(null), 5000);
    } finally {
      setSincronizando(false);
    }
  };

  const desconectarStrava = async () => {
    await guardar({ ...data, strava: { accessToken: null, refreshToken: null, expiresAt: null, ultimaSync: null } });
    setMensaje("Desconectado de Strava.");
    setTimeout(() => setMensaje(null), 3000);
  };

  // ---------- Respaldo en Google Drive (un solo archivo, se actualiza siempre el mismo) ----------
  const GDRIVE_NOMBRE_ARCHIVO = "Modo Bestia - Respaldo.json";

  const guardarGDriveClientId = () => {
    const val = (gdriveInput || "").trim();
    if (!val || !val.includes(".apps.googleusercontent.com")) {
      setMensaje("Ese ID no se ve válido.");
      setTimeout(() => setMensaje(null), 3000);
      return;
    }
    try { localStorage.setItem("gdrive_client_id", val); } catch (e) { /* sin localStorage disponible */ }
    setGdriveClientId(val);
    setConfigurandoDrive(false);
    setMensaje('Guardado — ahora toca "Guardar en Google Drive".');
    setTimeout(() => setMensaje(null), 4000);
  };

  const getGDriveToken = (clientId) => new Promise((resolve, reject) => {
    if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
      reject(new Error("Google todavía no cargó — intenta de nuevo"));
      return;
    }
    try {
      const tokenClient = window.google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: "https://www.googleapis.com/auth/drive.file",
        callback: (resp) => {
          if (resp && resp.access_token) resolve(resp.access_token);
          else reject(new Error((resp && resp.error) || "No se pudo conectar con Google"));
        },
        error_callback: (err) => {
          if (err && (err.type === "popup_closed" || err.type === "popup_failed_to_open")) reject(new Error("popup_cerrado"));
          else reject(new Error("No se pudo conectar con Google"));
        },
      });
      tokenClient.requestAccessToken();
    } catch (e) { reject(e); }
  });

  const subirArchivoADrive = async (token, json) => {
    const q = encodeURIComponent(`name='${GDRIVE_NOMBRE_ARCHIVO}' and trashed=false`);
    const buscar = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)`, {
      headers: { Authorization: "Bearer " + token },
    });
    if (!buscar.ok) throw new Error("No se pudo consultar Google Drive");
    const encontrados = await buscar.json();
    const existente = encontrados.files && encontrados.files[0];

    if (existente) {
      const upd = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${existente.id}?uploadType=media`, {
        method: "PATCH",
        headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
        body: json,
      });
      if (!upd.ok) throw new Error("No se pudo actualizar el archivo en Drive");
    } else {
      const boundary = "boundary_" + Date.now();
      const metadata = JSON.stringify({ name: GDRIVE_NOMBRE_ARCHIVO, mimeType: "application/json" });
      const body =
        "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + metadata + "\r\n" +
        "--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" + json + "\r\n" +
        "--" + boundary + "--";
      const crear = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: { Authorization: "Bearer " + token, "Content-Type": "multipart/related; boundary=" + boundary },
        body,
      });
      if (!crear.ok) throw new Error("No se pudo crear el archivo en Drive");
    }
  };

  const guardarEnGDrive = async () => {
    if (!gdriveClientId) { setGdriveInput(""); setConfigurandoDrive(true); return; }
    setGuardandoDrive(true);

      setMensaje("Conectando con Google…");
      const token = await getGDriveToken(gdriveClientId);
      const json = JSON.stringify({ app: "MODO BESTIA", version: 1, exportado: new Date().toISOString(), datos: data }, null, 2);
      await subirArchivoADrive(token, json);
      setMensaje("Respaldo guardado en Google Drive.");

      if (!(err && err.message === "popup_cerrado")) {

    } finally {
      setGuardandoDrive(false);
      setTimeout(() => setMensaje(null), 4000);
    }
  };

  // ---------- semana interactiva (reordenar solo la semana que estás viendo) ----------
  const ROWH = 56; // alto de cada fila para calcular el arrastre

  // Músculo de una fecha: usa la excepción de esa semana si existe;
  // si no, usa el horario base (recurrente) por día de semana.
  const obtenerMusculo = (fecha) => {
    if (data.planOverrides && data.planOverrides[fecha]) return data.planOverrides[fecha];
    const weekday = new Date(fecha + "T12:00:00").getDay();

  const moverPlanVisible = (diasVisibles, from, to) => {
    const nombres = diasVisibles.map((f) => obtenerMusculo(f));
    const [item] = nombres.splice(from, 1);
    nombres.splice(to, 0, item);
    const nuevosOverrides = { ...data.planOverrides };
    diasVisibles.forEach((f, i) => { nuevosOverrides[f] = nombres[i]; });
    return nuevosOverrides;

    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
    setDrag({ from: idx, y0: e.clientY });
  };

  const moverDrag = (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.y0;
    const shift = Math.round(dy / ROWH);
    if (shift !== 0) {
      const maxIdx = diasSemanaActiva.length - 1;
      const to = Math.max(0, Math.min(maxIdx, drag.from + shift));
      if (to !== drag.from) {
        guardar({ ...data, planOverrides: moverPlanVisible(diasSemanaActiva, drag.from, to) });
        setDrag({ from: to, y0: drag.y0 + (to - drag.from) * ROWH });
      }
    }
  };

  const celdas = useMemo(() => {

    const primero = new Date(y, m, 1).getDay();
    const diasMes = new Date(y, m + 1, 0).getDate();
    const arr = Array(primero).fill(null);
    for (let d = 1; d <= diasMes; d++) arr.push(`${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
    return arr;
  }, [mesCal]);

  // Al cambiar el mes real, esto se recalcula solo — sin intervención manual.
  const ahoraReal = new Date();

  const mesActual = ahoraReal.getMonth();
  const semanasMes = useMemo(() => semanasDelMes(anioActual, mesActual), [anioActual, mesActual]);
  const semanaActivaIdx = Math.min(semanaSel, semanasMes.length - 1);
  const diasSemanaActiva = semanasMes[semanaActivaIdx]?.dias || [];

  // Resumen simple del mes real en curso (para la tarjeta compacta de HOY)
  const diasEnMesActual = new Date(anioActual, mesActual + 1, 0).getDate();
  const mesActualStr = `${anioActual}-${String(mesActual + 1).padStart(2, "0")}`;
  const entrenadosMesActual = data.diasMarcados.filter((f) => f.startsWith(mesActualStr)).length;

  // frecuencia ≥2x/semana por grupo muscular para mejores resultados de fuerza/hipertrofia.
  const distribucionMusculos = useMemo(() => {
    const musculos = [...new Set(Object.values(data.plan))];
    const hace7 = new Date();
    hace7.setDate(hace7.getDate() - 6);
    const desde7 = iso(hace7);
    const conteo = {};
    musculos.forEach((m) => { conteo[m] = 0; });

      }
    });
    return musculos.map((m) => ({ musculo: m, veces: conteo[m] })).sort((a, b) => b.veces - a.veces);
  }, [data.plan, data.diasMarcados, data.planOverrides]);

  // Duración y esfuerzo real de tus sesiones, tal como Strava las reporta.
  const statsStrava = useMemo(() => {

    const delMes = acts.filter((a) => a.fecha.startsWith(mesActualStr));
    const totalMin = delMes.reduce((s, a) => s + (a.minutos || 0), 0);
    const promMin = delMes.length ? Math.round(totalMin / delMes.length) : null;
    const conEsfuerzo = delMes.filter((a) => a.esfuerzo != null);
    const esfuerzoProm = conEsfuerzo.length ? Math.round(conEsfuerzo.reduce((s, a) => s + a.esfuerzo, 0) / conEsfuerzo.length) : null;
    return { sesiones: delMes.length, totalMin, promMin, esfuerzoProm };
  }, [data.stravaActividades, mesActualStr]);

          <>
            {pesajePendiente && (
              <button className="recordatorio" onClick={() => setTab("stats")}>
                <span className="recIco">⚖️</span>
                <span className="recTxt">
                  <strong>Hoy es día de báscula</strong>
                  Pésate en ayunas y registra el dato — toca aquí
                </span>
                <span className="recFlecha">›</span>
              </button>
            )}
            {esDiaBascula && pesadoHoy && (
              <div className="recordatorio hecho">
                <span className="recIco">✓</span>
                <span className="recTxt"><strong>Pesaje de hoy registrado</strong>Control preciso — así se hace.</span>
              </div>
            )}

            {!data.strava.refreshToken ? (
              <button className="btnStrava" onClick={conectarStrava}>Conectar con Strava</button>
            ) : (
              <div className="card stravaFila">
                <span className={`stravaDot ${sincronizando ? "sync" : ""}`} />
                <span style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600 }}>{sincronizando ? "Sincronizando…" : "Conectado a Strava"}</div>
                  <div className="tip">{data.strava.ultimaSync ? fechaHoraCorta(data.strava.ultimaSync) : "Aún sin sincronizar"}</div>
                </span>
                <button className="btnMini" aria-label="sincronizar ahora" disabled={sincronizando} onClick={() => sincronizarStrava()}>⟳</button>
                <button className="btnMini" aria-label="desconectar Strava" onClick={desconectarStrava}>✕</button>
              </div>
            )}

            <button className="btnDrive" disabled={guardandoDrive} onClick={guardarEnGDrive}>
              {guardandoDrive ? "Guardando…" : gdriveClientId ? "Guardar en Google Drive" : "Conectar con Google Drive"}
            </button>
            {configurandoDrive && (
              <div className="card">
                <div className="numL" style={{ marginBottom: 10, marginTop: 0 }}>Conectar con Google Drive</div>
                <p className="tip" style={{ marginBottom: 10 }}>Pega tu ID de cliente de Google (ve la guía de configuración):</p>
                <div className="fila">
                  <input type="text" placeholder="xxxxx.apps.googleusercontent.com" aria-label="ID de cliente de Google"
                    value={gdriveInput} onChange={(e) => setGdriveInput(e.target.value)} style={{ flex: 1, minWidth: 120 }} />
                  <button className="btn" onClick={guardarGDriveClientId}>Guardar</button>
                </div>
              </div>
            )}

            <div className="card" style={{ textAlign: "center" }}>
              <div className="num" style={{ fontSize: 38 }}>
                {entrenadosMesActual}<span style={{ color: "var(--mut2)", fontSize: 20 }}> / {diasEnMesActual}</span>
              </div>
              <div className="numL">Días entrenados este mes</div>
            </div>

            <h2 className="titulo" style={{ marginTop: 4 }}>Semanas de entrenamiento {MESES[mesActual]}</h2>
            <div className="card">
              <div className="semChips">
                {semanasMes.map((s, i) => (
                  <button key={i} className={`semChip ${i === semanaActivaIdx ? "on" : ""}`} onClick={() => setSemanaSel(i)}>
                    <span className="semChipL">SEM</span>
                    <span className="semChipN">{i + 1}</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="card">
              <div className="semSemanaSub">
                {diaCorta(diasSemanaActiva[0])} – {diaCorta(diasSemanaActiva[diasSemanaActiva.length - 1])} · lo que hiciste según Strava · desliza ≡ para mover un día
              </div>
              {diasSemanaActiva.map((fecha, i) => {
                const musculo = obtenerMusculo(fecha);
                const marcado = data.diasMarcados.includes(fecha);
                return (
                  <div key={fecha} className={`semDiaRow ${drag && drag.from === i ? "dragging" : ""}`}>
                    <span className={`chk ${marcado ? "on" : ""}`} aria-hidden="true">{marcado ? "✓" : ""}</span>
                    <span className="semDiaFecha">{diaCorta(fecha)}</span>
                    <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{musculo}</span>
                    <button
                      className="handle"
                      onPointerDown={iniciarDrag(i)}
                      onPointerMove={moverDrag}
                      onPointerUp={soltarDrag}
                      onPointerCancel={soltarDrag}
                      aria-label={`mover ${musculo} a otro día`}>≡</button>
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* ================= CALENDARIO ================= */}
        {tab === "progreso" && (
          <>
            <h2 className="titulo">Calendario</h2>

            <div className="card">
              <div className="calHead">
                <button className="nav" aria-label="mes anterior" onClick={() => setMesCal(({ y, m }) => m === 0 ? { y: y - 1, m: 11 } : { y, m: m - 1 })}>‹</button>
                <div className="calMes">{MESES[mesCal.m]} {mesCal.y}</div>
                <button className="nav" aria-label="mes siguiente" onClick={() => setMesCal(({ y, m }) => m === 11 ? { y: y + 1, m: 0 } : { y, m: m + 1 })}>›</button>
              </div>
              <div className="calGrid">
                {["D", "L", "M", "M", "J", "V", "S"].map((l, i) => <div className="calDiaL" key={i}>{l}</div>)}
                {celdas.map((f, i) => f === null
                  ? <div className="celda vacia" key={i} />
                  : (
                    <button key={f}
                      className={`celda ${data.diasMarcados.includes(f) ? "marcado" : ""} ${f === hoyISO() ? "esHoy" : ""} ${f > hoyISO() ? "futuro" : ""}`}
                      onClick={() => toggleDiaCal(f)}
                      aria-label={`${f}${data.diasMarcados.includes(f) ? ", entrenado" : ""}`}>
                      {parseInt(f.slice(-2), 10)}
                    </button>
                  ))}
              </div>
              <div className="tip" style={{ marginTop: 12 }}>
                Toca cualquier día para marcarlo o corregirlo · <strong style={{ color: "var(--blueHi)" }}>{rachas.esteMes} días</strong> entrenados en {MESES[mesCal.m]}.
              </div>
            </div>
          </>
        )}

        {/* ================= ESTADÍSTICAS ================= */}
        {tab === "stats" && (
          <>
            <h2 className="titulo">Estadísticas</h2>

            <div className="card">
              <div className="numL" style={{ marginBottom: 12, marginTop: 0 }}>Tu regreso en números</div>
              <div className="statGrid">
                <div>
                  <div className="num">{estad.ritmo != null ? estad.ritmo.toFixed(1) : "—"}</div>
                  <div className="numL">Días / semana en promedio</div>
                </div>
                <div>
                  <div className="num">{estad.constancia != null ? Math.round(estad.constancia) + "%" : "—"}</div>
                  <div className="numL">Constancia desde el inicio</div>
                </div>
              </div>
              <div className="statGrid" style={{ marginTop: 16 }}>
                <div>
                  <div className="num" style={{ fontSize: 20 }}>{estad.mejorMes ? `${mesLabel(estad.mejorMes.mes)} · ${estad.mejorMes.dias}` : "—"}</div>
                  <div className="numL">Mejor mes (días entrenados)</div>
                </div>
                <div>
                  <div className="num" style={{ fontSize: 20 }}>{rachas.mejor}</div>
                  <div className="numL">Mejor racha</div>
                </div>
              </div>
              {estad.diasDesde != null && (
                <div className="tip" style={{ marginTop: 14 }}>
                  Llevas <strong style={{ color: "var(--blueHi)" }}>{estad.diasDesde} días</strong> desde tu primer entrenamiento registrado, con <strong style={{ color: "var(--blueHi)" }}>{data.diasMarcados.length} sesiones</strong> en total.
                </div>
              )}
            </div>

            <div className="card">
              <div className="numL" style={{ marginBottom: 4, marginTop: 0 }}>Distribución por músculo · últimos 7 días</div>
              <div className="tip" style={{ marginBottom: 12 }}>La evidencia sugiere al menos 2x por semana por grupo muscular para mejores resultados.</div>
              {distribucionMusculos.map((d) => (
                <div className="muscRow" key={d.musculo}>
                  <span className={`muscDot ${d.veces >= 2 ? "ok" : d.veces === 1 ? "med" : "bajo"}`} />
                  <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{d.musculo}</span>
                  <span className="muscVeces">{d.veces}x</span>
                </div>
              ))}
            </div>

            <div className="card">
              <div className="numL" style={{ marginBottom: 12, marginTop: 0 }}>Entrenamiento este mes (Strava)</div>
              <div className="statGrid">
                <div><div className="num">{statsStrava.sesiones}</div><div className="numL">Sesiones sincronizadas</div></div>
                <div><div className="num">{statsStrava.totalMin ? `${Math.floor(statsStrava.totalMin / 60)}h ${statsStrava.totalMin % 60}m` : "—"}</div><div className="numL">Tiempo total</div></div>
              </div>
              {(statsStrava.promMin != null || statsStrava.esfuerzoProm != null) && (
                <div className="statGrid" style={{ marginTop: 16 }}>
                  <div><div className="num" style={{ fontSize: 20 }}>{statsStrava.promMin != null ? `${statsStrava.promMin} min` : "—"}</div><div className="numL">Duración promedio</div></div>
                  <div><div className="num" style={{ fontSize: 20 }}>{statsStrava.esfuerzoProm != null ? statsStrava.esfuerzoProm : "—"}</div><div className="numL">Esfuerzo relativo prom.</div></div>
                </div>
              )}
            </div>

            <div className="card">
              <div className="numL" style={{ marginBottom: 12, marginTop: 0 }}>Mes a mes</div>
              {estad.porMes.length === 0 && <div className="tip">Marca tu primer día y registra tu primer pesaje — aquí se escribirá tu historia mes a mes.</div>}
              {[...estad.porMes].reverse().map((m) => (
                <div className="mesRow" key={m.mes}>
                  <div className="mesTop">
                    <span className="mesNombre">{mesLabel(m.mes)}</span>
                    <span className="mesDias">{m.dias} {m.dias === 1 ? "día" : "días"}</span>
                    <span className="mesPeso">
                      {m.prom != null ? `${m.prom.toFixed(1)} kg prom` : "sin pesajes"}
                      {m.cambio != null && (
                        <span className={`dif ${m.cambio < 0 ? "baja" : m.cambio > 0 ? "sube" : ""}`} style={{ marginLeft: 6 }}>
                          {m.cambio > 0 ? "+" : ""}{m.cambio.toFixed(1)}
                        </span>
                      )}
                    </span>
                  </div>
                  <div className="mesBarra"><div className="mesBarraFill" style={{ width: `${(m.dias / estad.maxDias) * 100}%` }} /></div>
                </div>
              ))}
            </div>

            <h2 className="titulo" style={{ marginTop: 24 }}>Peso</h2>

            <div className="card">
              <div className="statGrid">
                <div>
                  <div className="num">{pesoStats ? `${pesoStats.actual.kg} kg` : "—"}</div>
                  <div className="numL">Peso actual</div>
                </div>
                <div>
                  <div className="num" style={{ color: metaProyeccion && metaProyeccion.faltan <= 0 ? "var(--ok)" : "var(--txt)" }}>
                    {metaProyeccion ? `${metaProyeccion.faltan > 0 ? "-" : "+"}${Math.abs(metaProyeccion.faltan)} kg` : "—"}
                  </div>
                  <div className="numL">Para tu meta</div>
                </div>
              </div>

              {!editandoMeta ? (
                <div className="tip" style={{ marginTop: 14 }}>
                  Meta: <strong style={{ color: "var(--blueHi)" }}>{data.metaPeso.kg} kg</strong> para <strong style={{ color: "var(--blueHi)" }}>{fechaBonita(data.metaPeso.fecha)}</strong>
                  {" · "}
                  <button className="btnLink" onClick={() => { setMetaKgInput(String(data.metaPeso.kg)); setMetaFechaInput(data.metaPeso.fecha); setEditandoMeta(true); }}>editar</button>
                </div>
              ) : (
                <div className="fila" style={{ marginTop: 14 }}>
                  <input type="number" inputMode="decimal" placeholder="kg meta" aria-label="peso meta en kilos"
                    value={metaKgInput} onChange={(e) => setMetaKgInput(e.target.value)} />
                  <input type="date" className="inFecha" aria-label="fecha meta" value={metaFechaInput} onChange={(e) => setMetaFechaInput(e.target.value)} />
                  <button className="btn" onClick={guardarMeta}>Guardar</button>
                </div>
              )}

              {metaProyeccion && metaProyeccion.faltan > 0 && (
                <div className="tip" style={{ marginTop: 12 }}>
                  {metaProyeccion.fechaProyectada
                    ? <>A tu ritmo actual, llegarías a tu meta el <strong style={{ color: "var(--ok)" }}>{fechaBonita(iso(metaProyeccion.fechaProyectada))}</strong>.</>
                    : <>Necesitas bajar <strong style={{ color: "var(--blueHi)" }}>{metaProyeccion.ritmoNecesario.toFixed(2)} kg/semana</strong> para llegar a tiempo.</>}
                </div>
              )}
            </div>

            <div className={`card ${esDiaBascula ? "basculaAviso" : ""}`}>
              <div className="numL" style={{ marginBottom: 10, marginTop: 0 }}>Registrar pesaje</div>
              <div className="fila">
                <input type="number" inputMode="decimal" placeholder="kg" aria-label="peso corporal en kilos"
                  value={pesoInput} onChange={(e) => setPesoInput(e.target.value)} />
                <input type="date" className="inFecha" aria-label="fecha del pesaje" max={hoyISO()}
                  value={fechaPeso} onChange={(e) => setFechaPeso(e.target.value)} />
                <button className="btn" onClick={registrarPeso}>Registrar</button>
              </div>
            </div>

            <div className="card">
              <div className="numL" style={{ marginBottom: 10, marginTop: 0 }}>Historial de lunes · {historialLunes.length}</div>
              {historialLunes.length === 0 && <div className="tip">Aún no hay pesajes en lunes. Los lunes son tu checkpoint semanal.</div>}
              {[...historialLunes].reverse().map((p, i, arr) => {
                const anterior = arr[i + 1];
                const dif = anterior ? (p.kg - anterior.kg).toFixed(1) : null;
                return (
                  <div className="pesoRow" key={p.fecha}>
                    <span>
                      <strong>{p.kg} kg</strong>
                      <span style={{ color: "var(--mut)" }}> · {fechaBonita(p.fecha)}</span>
                      {dif !== null && dif != 0 && (
                        <span className={`dif ${dif < 0 ? "baja" : "sube"}`}>{dif > 0 ? "+" : ""}{dif}</span>
                      )}
                    </span>
                    <button className="x" aria-label={`borrar pesaje del ${p.fecha}`} onClick={() => borrarPeso(p.fecha)}>✕</button>
                  </div>
                );
              })}
            </div>
          </>
        )}

      </main>

      <nav className="tabs" aria-label="secciones">
        {[["hoy", "Hoy"], ["progreso", "Calendario"], ["stats", "Estadísticas"]].map(([k, l]) => (
          <button key={k} className={`tab ${tab === k ? "on" : ""}`} onClick={() => setTab(k)}>
            {l}
            {k === "stats" && pesajePendiente && <span className="tabDot" aria-label="pesaje pendiente" />}
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><ModoBestia /></ErrorBoundary>);

  </script>
</body>
</html>
