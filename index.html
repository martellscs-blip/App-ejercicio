<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MODO BESTIA</title>
  <meta name="description" content="Control de entrenamiento, rachas y peso corporal." />
  <meta name="theme-color" content="#08090B" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    html, body { margin: 0; padding: 0; background: #08090B; }
    #cargando { min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #4C7EDB; font-family: sans-serif; letter-spacing: 3px; font-size: 14px; }
  </style>
  <script>
    (function () {
      const avisoOriginal = console.warn;
      console.warn = function (...args) {
        if (String(args[0]).includes("in-browser Babel transformer")) return;
        avisoOriginal.apply(console, args);
      };
      window.addEventListener("error", function (e) { console.error("Error capturado:", e.error || e.message); });
      window.addEventListener("unhandledrejection", function (e) { console.error("Promesa rechazada:", e.reason); });
    })();
  </script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
</head>
<body>
  <div id="root"><div id="cargando">MODO BESTIA</div></div>
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid, ReferenceLine } = Recharts;

// Red de seguridad: si algo llegara a fallar, muestra un mensaje limpio
// en vez de un error tecnico crudo, con boton para recargar.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Error capturado:", error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ minHeight: "100vh", background: "#08090B", color: "#E6E8EC", display: "flex",
          flexDirection: "column", alignItems: "center", justifyContent: "center", fontFamily: "sans-serif",
          padding: 24, textAlign: "center", gap: 14 }}>
          <div style={{ fontSize: 15 }}>Algo no cargo bien. Tus datos guardados siguen a salvo.</div>
          <button onClick={() => window.location.reload()} style={{ background: "#4C7EDB", color: "#0A0E16",
            border: "none", borderRadius: 10, padding: "10px 20px", fontWeight: 600, cursor: "pointer", fontSize: 14 }}>
            Recargar
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

// ============ TU SEMANA (plan por defecto — puedes reordenarla en la app) ============
const PLAN_DEFAULT = {
  1: "Pecho y Bíceps",
  2: "Espalda y Tríceps",
  3: "Pierna Completa",
  4: "Hombros, Trapecio y Antebrazo",
  5: "Pierna Completa + Cardio",
  6: "Cardio",
  0: "Cardio",
};
const ORDEN_SEMANA = [1, 2, 3, 4, 5, 6, 0]; // lunes a domingo
// Sube este número cada vez que se edite PLAN_DEFAULT desde el chat.
// Así, la próxima vez que abras la app, tu semana se corrige sola —
// sin pisar un reordenamiento que tú hayas hecho a mano después.
const PLAN_VERSION = 2;

const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const MESES = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

const STORAGE_KEY = "fierro-data-v2"; // misma llave: tu historial se conserva

// Adaptador de almacenamiento: usa window.storage (entorno de Claude) si existe;
// en hosting externo (GitHub Pages, Vercel, etc.) usa localStorage del navegador.
const storage = {
  async get(k) {
    if (typeof window !== "undefined" && window.storage) return window.storage.get(k);
    const v = localStorage.getItem(k);
    if (v === null) throw new Error("sin datos previos");
    return { value: v };
  },
  async set(k, v) {
    if (typeof window !== "undefined" && window.storage) return window.storage.set(k, v);
    localStorage.setItem(k, v);
    return { key: k, value: v };
  },
};
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const hoyISO = () => iso(new Date());
const fechaBonita = (s) => new Date(s + "T12:00:00").toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" });
const fechaCorta = (s) => new Date(s + "T12:00:00").toLocaleDateString("es-MX", { day: "numeric", month: "short" });
const diaCorta = (s) => new Date(s + "T12:00:00").toLocaleDateString("es-MX", { weekday: "short", day: "numeric" });

// Semanas del MES en curso, en bloques de 7 días (1-7, 8-14, ...).
// Se recalcula solo con año/mes reales: al cambiar de mes, cambia sola.
function semanasDelMes(anio, mes) {
  const ultimoDia = new Date(anio, mes + 1, 0).getDate();
  const semanas = [];
  for (let inicio = 1; inicio <= ultimoDia; inicio += 7) {
    const fin = Math.min(inicio + 6, ultimoDia);
    const dias = [];
    for (let d = inicio; d <= fin; d++) dias.push(`${anio}-${String(mes + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
    semanas.push({ dias });
  }
  return semanas;
}

function ModoBestia() {
  const [tab, setTab] = useState("hoy");
  const [data, setData] = useState({ pesoCorporal: [], diasMarcados: [], plan: PLAN_DEFAULT, planVersion: PLAN_VERSION, musculosMarcados: [] });
  const [drag, setDrag] = useState(null); // {from, y0} para reordenar la semana
  const [cargado, setCargado] = useState(false);
  const [pesoInput, setPesoInput] = useState("");
  const [fechaPeso, setFechaPeso] = useState(hoyISO());
  const [mensaje, setMensaje] = useState(null);
  const [mesCal, setMesCal] = useState(() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; });
  const [importTxt, setImportTxt] = useState("");
  const [pegadoManual, setPegadoManual] = useState(false);
  const [semanaSel, setSemanaSel] = useState(() => Math.floor((new Date().getDate() - 1) / 7));
  const diaSemanaHoy = new Date().getDay();

  useEffect(() => {
    (async () => {
      try {
        const r = await storage.get(STORAGE_KEY);
        if (r && r.value) {
          const d = JSON.parse(r.value);
          const versionGuardada = d.planVersion || 0;
          const planFinal = versionGuardada < PLAN_VERSION ? { ...PLAN_DEFAULT } : { ...PLAN_DEFAULT, ...(d.plan || {}) };
          setData({ pesoCorporal: d.pesoCorporal || [], diasMarcados: d.diasMarcados || [], plan: planFinal, planVersion: PLAN_VERSION, musculosMarcados: d.musculosMarcados || [] });
        }
      } catch (e) { /* primera vez */ }
      setCargado(true);
    })();
  }, []);

  const guardar = async (nueva) => {
    setData(nueva);
    try { await storage.set(STORAGE_KEY, JSON.stringify(nueva)); }
    catch (e) { console.error("No se pudo guardar", e); }
  };

  // ---------- rachas ----------
  const rachas = useMemo(() => {
    const set = new Set(data.diasMarcados);
    let actual = 0;
    const d = new Date();
    if (!set.has(iso(d))) d.setDate(d.getDate() - 1);
    while (set.has(iso(d))) { actual++; d.setDate(d.getDate() - 1); }
    const orden = [...set].sort();
    let mejor = 0, run = 0, prev = null;
    for (const f of orden) {
      if (prev) {
        const p = new Date(prev + "T12:00:00"); p.setDate(p.getDate() + 1);
        run = iso(p) === f ? run + 1 : 1;
      } else run = 1;
      mejor = Math.max(mejor, run);
      prev = f;
    }
    const mesStr = `${mesCal.y}-${String(mesCal.m + 1).padStart(2, "0")}`;
    const esteMes = data.diasMarcados.filter((f) => f.startsWith(mesStr)).length;
    let ult7 = 0;
    for (let i = 0; i < 7; i++) { const x = new Date(); x.setDate(x.getDate() - i); if (set.has(iso(x))) ult7++; }
    return { actual, mejor, esteMes, total: set.size, ult7 };
  }, [data.diasMarcados, mesCal]);

  // ---------- estadísticas de peso ----------
  const pesoStats = useMemo(() => {
    const p = data.pesoCorporal;
    if (p.length === 0) return null;
    const inicio = p[0], actual = p[p.length - 1];
    const total = (actual.kg - inicio.kg).toFixed(1);
    const previo = p.length >= 2 ? (actual.kg - p[p.length - 2].kg).toFixed(1) : null;
    const min = Math.min(...p.map((x) => x.kg));
    return { inicio, actual, total, previo, min };
  }, [data.pesoCorporal]);

  // ---------- estadísticas mensuales y del regreso ----------
  const estad = useMemo(() => {
    const mesesSet = new Set();
    data.diasMarcados.forEach((f) => mesesSet.add(f.slice(0, 7)));
    data.pesoCorporal.forEach((p) => mesesSet.add(p.fecha.slice(0, 7)));
    const meses = [...mesesSet].sort();

    const porMes = meses.map((m) => {
      const dias = data.diasMarcados.filter((f) => f.startsWith(m)).length;
      const pesos = data.pesoCorporal.filter((p) => p.fecha.startsWith(m)).map((p) => p.kg);
      const prom = pesos.length ? pesos.reduce((a, b) => a + b, 0) / pesos.length : null;
      return { mes: m, dias, prom };
    });

    // cambio de peso vs el mes anterior con datos (usando promedios: la tendencia real)
    let prev = null;
    porMes.forEach((x) => {
      if (x.prom != null) { x.cambio = prev != null ? x.prom - prev : null; prev = x.prom; }
      else x.cambio = null;
    });

    const conDias = porMes.filter((x) => x.dias > 0);
    const mejorMes = conDias.length ? conDias.reduce((a, b) => (b.dias >= a.dias ? b : a)) : null;
    const maxDias = Math.max(1, ...porMes.map((x) => x.dias));

    // ritmo y constancia desde el primer día marcado
    const marcados = [...data.diasMarcados].sort();
    let ritmo = null, constancia = null, diasDesde = null;
    if (marcados.length) {
      const desde = new Date(marcados[0] + "T12:00:00");
      diasDesde = Math.max(1, Math.round((new Date() - desde) / 86400000) + 1);
      ritmo = (data.diasMarcados.length / diasDesde) * 7;
      constancia = (data.diasMarcados.length / diasDesde) * 100;
    }

    // ritmo de cambio de peso por semana
    let ritmoPeso = null;
    if (data.pesoCorporal.length >= 2) {
      const a = data.pesoCorporal[0], b = data.pesoCorporal[data.pesoCorporal.length - 1];
      const sem = Math.max(1, (new Date(b.fecha) - new Date(a.fecha)) / 86400000 / 7);
      ritmoPeso = (b.kg - a.kg) / sem;
    }

    return { porMes, mejorMes, maxDias, ritmo, constancia, ritmoPeso, diasDesde };
  }, [data]);

  const mesLabel = (m) => `${MESES[parseInt(m.slice(5, 7), 10) - 1].slice(0, 3)} ${m.slice(2, 4)}`;

  // ---------- acciones ----------
  const hoyMarcado = data.diasMarcados.includes(hoyISO());

  const marcarHoy = async () => {
    const h = hoyISO();
    if (hoyMarcado) {
      await guardar({ ...data, diasMarcados: data.diasMarcados.filter((f) => f !== h) });
      return;
    }
    await guardar({ ...data, diasMarcados: [...data.diasMarcados, h] });
    const r = rachas.actual + 1;
    setMensaje(r >= 7 ? `${r} días de racha. Esto ya no es motivación, es identidad.`
      : r >= 3 ? `Día marcado. ${r} días de racha — estás en llamas.`
      : "Día marcado. Otro ladrillo en tu muralla.");
    setTimeout(() => setMensaje(null), 4500);
  };

  const toggleDiaCal = async (fecha) => {
    if (fecha > hoyISO()) return;
    const marcados = data.diasMarcados.includes(fecha)
      ? data.diasMarcados.filter((f) => f !== fecha)
      : [...data.diasMarcados, fecha];
    await guardar({ ...data, diasMarcados: marcados });
  };

  // Bitácora de músculos por semana del mes — NO cuenta para racha ni estadísticas.
  // Solo lo que se marca en el Calendario (o el botón de HOY) alimenta las métricas.
  const toggleMusculo = async (fecha) => {
    if (fecha > hoyISO()) return;
    const marcados = data.musculosMarcados.includes(fecha)
      ? data.musculosMarcados.filter((f) => f !== fecha)
      : [...data.musculosMarcados, fecha];
    await guardar({ ...data, musculosMarcados: marcados });
  };

  const registrarPeso = async () => {
    const kg = parseFloat(pesoInput);
    if (!kg || kg <= 0 || !fechaPeso || fechaPeso > hoyISO()) return;
    const sinFecha = data.pesoCorporal.filter((p) => p.fecha !== fechaPeso);
    const lista = [...sinFecha, { fecha: fechaPeso, kg }].sort((a, b) => a.fecha.localeCompare(b.fecha));
    await guardar({ ...data, pesoCorporal: lista });
    setPesoInput("");
    const dif = lista.length >= 2 ? (lista[lista.length - 1].kg - lista[0].kg).toFixed(1) : null;
    setMensaje(dif && dif < 0 ? `Registrado. Ya son ${Math.abs(dif)} kg menos desde el inicio — la báscula dice que vas ganando.`
      : "Peso registrado con fecha exacta. La tendencia es lo que importa.");
    setTimeout(() => setMensaje(null), 5000);
  };

  const borrarPeso = async (fecha) => {
    await guardar({ ...data, pesoCorporal: data.pesoCorporal.filter((p) => p.fecha !== fecha) });
  };

  // ---------- semana interactiva (reordenar el plan) ----------
  const ROWH = 56; // alto de cada fila para calcular el arrastre
  // Traduce un día real (0=domingo...6=sábado) a su posición en ORDEN_SEMANA (0=lunes...6=domingo)
  const posEnOrden = (diaSemana) => (diaSemana === 0 ? 6 : diaSemana - 1);

  const moverPlan = (from, to) => {
    const nombres = ORDEN_SEMANA.map((d) => data.plan[d]);
    const [item] = nombres.splice(from, 1);
    nombres.splice(to, 0, item);
    const nuevo = {};
    ORDEN_SEMANA.forEach((d, i) => { nuevo[d] = nombres[i]; });
    return nuevo;
  };

  const iniciarDrag = (idx) => (e) => {
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
    setDrag({ from: idx, y0: e.clientY });
  };

  const moverDrag = (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.y0;
    const shift = Math.round(dy / ROWH);
    if (shift !== 0) {
      const to = Math.max(0, Math.min(6, drag.from + shift));
      if (to !== drag.from) {
        guardar({ ...data, plan: moverPlan(drag.from, to) });
        setDrag({ from: to, y0: drag.y0 + (to - drag.from) * ROWH });
      }
    }
  };

  const soltarDrag = () => setDrag(null);

  // ---------- respaldo ----------
  const armarRespaldo = () => JSON.stringify({ app: "MODO BESTIA", version: 3, exportado: new Date().toISOString(), datos: data }, null, 2);

  const copiarRespaldo = async () => {
    const txt = armarRespaldo();
    try {
      await navigator.clipboard.writeText(txt);
      setMensaje("Respaldo copiado. Abre tu app de Notas y pega — esa es tu copia de seguridad completa.");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); setMensaje("Respaldo copiado. Pégalo en tu app de notas."); }
      catch { setMensaje("No se pudo copiar automáticamente. Intenta de nuevo."); }
      ta.remove();
    }
    setTimeout(() => setMensaje(null), 5000);
  };

  const validarYRestaurar = async (texto) => {
    try {
      const obj = JSON.parse(texto);
      const d = obj.datos || obj;
      if (!d || !Array.isArray(d.pesoCorporal) || !Array.isArray(d.diasMarcados)) throw new Error("estructura inválida");
      const versionGuardada = d.planVersion || 0;
      const planFinal = versionGuardada < PLAN_VERSION ? { ...PLAN_DEFAULT } : { ...PLAN_DEFAULT, ...(d.plan && typeof d.plan === "object" ? d.plan : {}) };
      const limpio = { pesoCorporal: d.pesoCorporal, diasMarcados: d.diasMarcados, plan: planFinal, planVersion: PLAN_VERSION, musculosMarcados: Array.isArray(d.musculosMarcados) ? d.musculosMarcados : [] };
      await guardar(limpio);
      setImportTxt("");
      setMensaje(`Restaurado: ${limpio.pesoCorporal.length} pesajes y ${limpio.diasMarcados.length} días de entrenamiento de vuelta. La bestia no olvida.`);
    } catch (e) {
      setMensaje("Ese respaldo no es válido. Verifica que copiaste el texto completo (empieza con { y termina con }).");
    }
    setTimeout(() => setMensaje(null), 6000);
  };

  const pegarYRestaurar = async () => {
    try {
      const txt = await navigator.clipboard.readText();
      if (!txt || !txt.trim()) throw new Error("vacío");
      await validarYRestaurar(txt);
    } catch (e) {
      // si el navegador no permite leer el portapapeles, mostramos el pegado manual
      setPegadoManual(true);
      setMensaje("Tu navegador no dejó leer el portapapeles. Pega el texto en el cuadro de abajo.");
      setTimeout(() => setMensaje(null), 5000);
    }
  };

  // ---------- calendario ----------
  const celdas = useMemo(() => {
    const { y, m } = mesCal;
    const primero = new Date(y, m, 1).getDay();
    const diasMes = new Date(y, m + 1, 0).getDate();
    const arr = Array(primero).fill(null);
    for (let d = 1; d <= diasMes; d++) arr.push(`${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
    return arr;
  }, [mesCal]);

  const esDiaBascula = diaSemanaHoy === 1 || diaSemanaHoy === 5;
  const pesadoHoy = data.pesoCorporal.some((p) => p.fecha === hoyISO());
  const pesajePendiente = esDiaBascula && !pesadoHoy;
  const graf = data.pesoCorporal.map((p) => ({ fecha: fechaCorta(p.fecha), kg: p.kg }));

  // Semanas del mes REAL en curso (independiente del navegador de meses del Calendario).
  // Al cambiar el mes real, esto se recalcula solo — sin intervención manual.
  const ahoraReal = new Date();
  const anioActual = ahoraReal.getFullYear();
  const mesActual = ahoraReal.getMonth();
  const semanasMes = useMemo(() => semanasDelMes(anioActual, mesActual), [anioActual, mesActual]);
  const semanaActivaIdx = Math.min(semanaSel, semanasMes.length - 1);
  const diasSemanaActiva = semanasMes[semanaActivaIdx]?.dias || [];

  if (!cargado) return <div style={{ background: "#08090B", minHeight: "100vh" }} />;

  return (
    <div className="app">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
        :root {
          --bg: #08090B;
          --panel: #101216;
          --panel2: #14171C;
          --line: #1D2127;
          --line2: #262B33;
          --txt: #E6E8EC;
          --mut: #7A828E;
          --mut2: #545C68;
          --navy: #16233C;
          --navy2: #1C2E4F;
          --blue: #4C7EDB;
          --blueHi: #6E99E8;
          --ok: #58B08C;
          --bad: #C97070;
        }
        * { box-sizing: border-box; margin: 0; }
        .app { min-height: 100vh; background: var(--bg); color: var(--txt); font-family: 'Inter', sans-serif; padding-bottom: 92px; -webkit-font-smoothing: antialiased; }
        .head { padding: 22px 22px 16px; border-bottom: 1px solid var(--line); }
        .marca { font-family: 'Space Grotesk'; font-weight: 700; font-size: 20px; letter-spacing: 4px; text-transform: uppercase; }
        .marca span { color: var(--blue); }
        .cont { padding: 20px 22px; max-width: 560px; margin: 0 auto; }
        .titulo { font-family: 'Space Grotesk'; font-weight: 500; font-size: 15px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--mut); margin-bottom: 14px; }
        .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 14px; }
        .hoyCard { background: linear-gradient(160deg, var(--navy) 0%, var(--panel) 60%); border: 1px solid var(--navy2); padding: 14px 16px; }
        .hoyDia { font-size: 10px; color: var(--blueHi); text-transform: uppercase; letter-spacing: 2.5px; font-weight: 600; }
        .hoyNombre { font-family: 'Space Grotesk'; font-weight: 700; font-size: 20px; letter-spacing: -.5px; margin-top: 4px; }
        .btnMarcar { margin-top: 12px; width: 100%; padding: 12px; border: none; border-radius: 11px; font-family: 'Space Grotesk'; font-weight: 700; font-size: 13px; letter-spacing: .5px; cursor: pointer; transition: background .15s, transform .1s; }
        .btnMarcar.off { background: var(--blue); color: #0A0E16; }
        .btnMarcar.off:hover { background: var(--blueHi); }
        .btnMarcar.off:active { transform: scale(.985); }
        .btnMarcar.on { background: transparent; color: var(--ok); border: 1px solid #2A4A3C; }
        .btnMarcar:focus-visible { outline: 2px solid var(--txt); }
        .chk { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line2); background: transparent; color: #0A0E16; cursor: pointer; flex-shrink: 0; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: background .12s, border-color .12s; padding: 0; }
        .chk:hover { border-color: var(--blue); }
        .chk.on { background: var(--blue); border-color: var(--blueHi); }
        .chk:disabled { opacity: .25; cursor: default; }
        .chk:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

        input, .inFecha { background: var(--bg); border: 1px solid var(--line2); color: var(--txt); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-family: 'Inter'; color-scheme: dark; }

        input:focus { outline: 2px solid var(--blue); border-color: transparent; }
        .btn { background: var(--blue); color: #0A0E16; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: 14px; cursor: pointer; font-family: 'Inter'; transition: background .15s; }

        .nav:hover { border-color: var(--blue); }
        .calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calDiaL { text-align: center; font-size: 10px; color: var(--mut2); text-transform: uppercase; letter-spacing: 1px; padding: 4px 0; }
        .celda { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--mut); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'Inter'; transition: border-color .12s; }
        .celda:hover { border-color: var(--blue); }

        .rachaBig { text-align: center; padding: 8px 0 4px; }
        .rachaBig.compacta { padding: 4px 0 2px; }
        .rachaBig.compacta .rachaNum { font-size: 36px; }
        .rachaBig.compacta .num { font-size: 18px; }

        .rachaNum em { font-style: normal; color: var(--blue); }
        .semChips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
        .semChips::-webkit-scrollbar { display: none; }
        .semChip { flex-shrink: 0; width: 54px; height: 54px; border-radius: 12px; border: 1px solid var(--line2); background: var(--panel2); color: var(--mut); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-family: 'Space Grotesk'; transition: border-color .12s, background .12s; }
        .semChip .semChipL { font-size: 8.5px; letter-spacing: 1px; color: var(--mut2); }
        .semChip .semChipN { font-size: 19px; font-weight: 700; line-height: 1.1; }
        .semChip.on { background: var(--blue); border-color: var(--blueHi); color: #0A0E16; }
        .semChip.on .semChipL { color: rgba(10,14,22,.65); }
        .semChip:hover { border-color: var(--blue); }
        .semChip:focus-visible { outline: 2px solid var(--blue); }
        .semSemanaSub { font-size: 12px; color: var(--mut); margin-bottom: 8px; text-transform: capitalize; }
        .semDiaRow { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); height: 56px; font-size: 13.5px; }
        .semDiaRow:first-of-type { border-top: none; }
        .semDiaRow.dragging { background: var(--navy); border-radius: 12px; border-top-color: transparent; }
        .semDiaRow.dragging + .semDiaRow { border-top-color: transparent; }
        .semDiaFecha { width: 56px; flex-shrink: 0; font-size: 11px; color: var(--mut2); text-transform: capitalize; }
        .basculaAviso { background: linear-gradient(160deg, var(--navy) 0%, var(--panel) 70%); border: 1px solid var(--navy2); }
        .pesoRow { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding: 11px 0; font-size: 14px; }
        .pesoRow:first-of-type { border-top: none; }
        .dif { font-size: 12px; margin-left: 8px; font-weight: 500; }
        .dif.baja { color: var(--ok); }
        .dif.sube { color: var(--bad); }
        .x { background: none; border: none; color: var(--mut2); cursor: pointer; font-size: 15px; padding: 4px 8px; }
        .x:hover { color: var(--bad); }
        textarea { width: 100%; min-height: 90px; background: var(--bg); border: 1px solid var(--line2); border-radius: 10px; color: var(--txt); padding: 12px; font-family: monospace; font-size: 12px; resize: vertical; }
        textarea:focus { outline: 2px solid var(--blue); }
        .listaRow { display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding: 12px 0; font-size: 14.5px; }
        .listaRow:first-of-type { border-top: none; padding-top: 2px; }
        .listaRow:last-of-type { padding-bottom: 2px; }
        .listaRow strong { margin-left: auto; font-family: 'Space Grotesk'; font-weight: 700; font-size: 16px; }
        .listaIco { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
        .secLabel { font-size: 11.5px; color: var(--mut); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin: 22px 0 8px; }
        .secTxt { font-size: 13.5px; color: var(--mut); line-height: 1.55; margin-bottom: 12px; }
        .btnGhost { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 17px; font-family: 'Inter'; font-weight: 600; font-size: 15px; cursor: pointer; transition: border-color .15s, background .15s; }
        .btnGhost:hover { border-color: var(--line2); background: var(--panel2); }
        .btnGhost:focus-visible { outline: 2px solid var(--blue); }
        .nota { display: flex; gap: 10px; margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 13px; color: var(--mut); line-height: 1.55; }
        .mesRow { border-top: 1px solid var(--line); padding: 12px 0; }
        .mesRow:first-of-type { border-top: none; padding-top: 2px; }
        .mesTop { display: flex; align-items: baseline; gap: 10px; font-size: 13.5px; }
        .mesNombre { font-family: 'Space Grotesk'; font-weight: 700; font-size: 14px; width: 62px; flex-shrink: 0; text-transform: capitalize; }
        .mesDias { color: var(--blueHi); font-weight: 600; white-space: nowrap; }
        .mesPeso { margin-left: auto; color: var(--mut); white-space: nowrap; }
        .mesBarra { margin-top: 8px; height: 5px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
        .mesBarraFill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--navy2), var(--blue)); transition: width .3s; }
        .recordatorio { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: linear-gradient(135deg, var(--navy2), var(--navy)); border: 1px solid var(--blue); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; color: var(--txt); cursor: pointer; font-family: 'Inter'; }
        .recordatorio.hecho { background: var(--panel); border-color: #2A4A3C; cursor: default; }
        .recordatorio.hecho .recIco { color: var(--ok); }
        .recIco { font-size: 20px; flex-shrink: 0; }
        .recTxt { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; color: var(--mut); min-width: 0; }
        .recTxt strong { font-size: 14px; color: var(--txt); font-weight: 600; }
        .recFlecha { margin-left: auto; font-size: 22px; color: var(--blueHi); flex-shrink: 0; }
        .recordatorio:focus-visible { outline: 2px solid var(--blueHi); }
        .tabDot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--blueHi); margin-left: 5px; vertical-align: middle; margin-top: -2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      `}</style>

      {mensaje && <div className="toast" role="status">{mensaje}</div>}

      <header className="head">
        <div className="marca">Modo <span>Bestia</span></div>
      </header>

      <main className="cont">
        {/* ================= HOY ================= */}
        {tab === "hoy" && (
          <>
            {pesajePendiente && (
              <button className="recordatorio" onClick={() => setTab("peso")}>
                <span className="recIco">⚖️</span>
                <span className="recTxt">
                  <strong>Hoy es día de báscula</strong>
                  Pésate en ayunas y registra el dato — toca aquí
                </span>
                <span className="recFlecha">›</span>
              </button>
            )}
            {esDiaBascula && pesadoHoy && (
              <div className="recordatorio hecho">
                <span className="recIco">✓</span>
                <span className="recTxt"><strong>Pesaje de hoy registrado</strong>Control preciso — así se hace.</span>
              </div>
            )}
            <div className="card hoyCard">
              <div className="hoyDia">{DIAS[diaSemanaHoy]} · hoy toca</div>
              <div className="hoyNombre">{data.plan[diaSemanaHoy]}</div>
              <button className={`btnMarcar ${hoyMarcado ? "on" : "off"}`} onClick={marcarHoy}>
                {hoyMarcado ? "✓ Día conquistado — toca para desmarcar" : "Marcar hoy como entrenado"}
              </button>
            </div>

            <div className="card rachaBig compacta">
              <div className="rachaNum">{rachas.actual}<em>·</em></div>
              <div className="numL">Días de racha actual</div>
              <div className="statGrid" style={{ marginTop: 10 }}>
                <div><div className="num">{rachas.ult7}</div><div className="numL">Últimos 7 días</div></div>
                <div><div className="num">{rachas.mejor}</div><div className="numL">Mejor racha</div></div>
              </div>
            </div>

            <h2 className="titulo" style={{ marginTop: 4 }}>Semanas de entrenamiento {MESES[mesActual]}</h2>
            <div className="card">
              <div className="semChips">
                {semanasMes.map((s, i) => (
                  <button key={i} className={`semChip ${i === semanaActivaIdx ? "on" : ""}`} onClick={() => setSemanaSel(i)}>
                    <span className="semChipL">SEM</span>
                    <span className="semChipN">{i + 1}</span>
                  </button>
                ))}
              </div>
            </div>

            <div className="card">
              <div className="semSemanaSub">
                {diaCorta(diasSemanaActiva[0])} – {diaCorta(diasSemanaActiva[diasSemanaActiva.length - 1])} · desliza ≡ para mover un día
              </div>
              {diasSemanaActiva.map((fecha) => {
                const weekday = new Date(fecha + "T12:00:00").getDay();
                const posOrden = posEnOrden(weekday);
                const musculo = data.plan[weekday];
                const marcado = data.musculosMarcados.includes(fecha);
                const futuro = fecha > hoyISO();
                return (
                  <div key={fecha} className={`semDiaRow ${drag && drag.from === posOrden ? "dragging" : ""}`}>
                    <button
                      className={`chk ${marcado ? "on" : ""}`}
                      disabled={futuro}
                      onClick={() => toggleMusculo(fecha)}
                      aria-label={`${diaCorta(fecha)}, ${musculo}: ${marcado ? "hecho, toca para desmarcar" : "marcar como hecho"}`}>
                      {marcado ? "✓" : ""}
                    </button>
                    <span className="semDiaFecha">{diaCorta(fecha)}</span>
                    <span style={{ minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{musculo}</span>
                    <button
                      className="handle"
                      onPointerDown={iniciarDrag(posOrden)}
                      onPointerMove={moverDrag}
                      onPointerUp={soltarDrag}
                      onPointerCancel={soltarDrag}
                      aria-label={`mover ${musculo} a otro día`}>≡</button>
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* ================= PESO ================= */}
        {tab === "peso" && (
          <>
            <h2 className="titulo">Control de peso</h2>

            {pesoStats && (
              <div className="card">
                <div className="statGrid">
                  <div><div className="num">{pesoStats.actual.kg} kg</div><div className="numL">Actual · {fechaCorta(pesoStats.actual.fecha)}</div></div>
                  <div>
                    <div className="num" style={{ color: Number(pesoStats.total) < 0 ? "var(--ok)" : "var(--blueHi)" }}>{Number(pesoStats.total) > 0 ? "+" : ""}{pesoStats.total} kg</div>
                    <div className="numL">Desde el inicio · {fechaCorta(pesoStats.inicio.fecha)}</div>
                  </div>
                </div>
                {pesoStats.previo !== null && (
                  <div className="tip" style={{ marginTop: 14 }}>
                    Último cambio: <strong style={{ color: pesoStats.previo <= 0 ? "var(--ok)" : "var(--bad)" }}>{pesoStats.previo > 0 ? "+" : ""}{pesoStats.previo} kg</strong> vs pesaje anterior · Mínimo histórico: <strong style={{ color: "var(--blueHi)" }}>{pesoStats.min} kg</strong>
                  </div>
                )}
              </div>
            )}

            <div className={`card ${esDiaBascula ? "basculaAviso" : ""}`}>
              <div className="numL" style={{ marginBottom: 10, marginTop: 0 }}>Registrar pesaje</div>
              {esDiaBascula && <div style={{ fontSize: 13, marginBottom: 12, color: "var(--blueHi)" }}>Hoy es día de báscula — recién despierto, después del baño, antes de desayunar.</div>}
              <div className="fila">
                <input type="number" inputMode="decimal" placeholder="kg" aria-label="peso corporal en kilos"
                  value={pesoInput} onChange={(e) => setPesoInput(e.target.value)} />
                <input type="date" className="inFecha" aria-label="fecha del pesaje" max={hoyISO()}
                  value={fechaPeso} onChange={(e) => setFechaPeso(e.target.value)} />
                <button className="btn" onClick={registrarPeso}>Registrar</button>
              </div>
              <div className="tip" style={{ marginTop: 12 }}>
                Elige la fecha exacta si olvidaste capturar un pesaje. Registrar dos veces la misma fecha actualiza el dato.
              </div>
            </div>

            <div className="card">
              <div className="numL" style={{ marginBottom: 10, marginTop: 0 }}>Evolución</div>
              {graf.length >= 2 ? (
                <div style={{ height: 220 }}>
                  <ResponsiveContainer>
                    <LineChart data={graf} margin={{ top: 6, right: 8, left: -18, bottom: 0 }}>
                      <CartesianGrid stroke="#1D2127" strokeDasharray="3 3" />
                      <XAxis dataKey="fecha" tick={{ fill: "#7A828E", fontSize: 11 }} />
                      <YAxis domain={["dataMin - 1", "dataMax + 1"]} tick={{ fill: "#7A828E", fontSize: 11 }} />
                      <Tooltip contentStyle={{ background: "#14171C", border: "1px solid #262B33", borderRadius: 10, color: "#E6E8EC" }} />
                      {pesoStats && <ReferenceLine y={pesoStats.min} stroke="#58B08C" strokeDasharray="4 4" />}
                      <Line type="monotone" dataKey="kg" stroke="#4C7EDB" strokeWidth={2.5} dot={{ fill: "#4C7EDB", r: 3.5 }} />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              ) : (
                <div className="tip">
                  Protocolo del coach: pésate <strong style={{ color: "var(--txt)" }}>lunes y viernes</strong>, siempre a la misma hora. Con 2 registros verás tu gráfica aquí. El peso diario fluctúa por agua y comida — lo que gana batallas es la <strong style={{ color: "var(--txt)" }}>tendencia</strong>.
                </div>
              )}
            </div>

            <div className="card">
              <div className="numL" style={{ marginBottom: 10, marginTop: 0 }}>Historial de pesajes · {data.pesoCorporal.length}</div>
              {data.pesoCorporal.length === 0 && <div className="tip">Aún no hay pesajes. El primer dato es la línea de salida — regístralo hoy.</div>}
              {[...data.pesoCorporal].reverse().map((p, i, arr) => {
                const anterior = arr[i + 1];
                const dif = anterior ? (p.kg - anterior.kg).toFixed(1) : null;
                return (
                  <div className="pesoRow" key={p.fecha}>
                    <span>
                      <strong>{p.kg} kg</strong>
                      <span style={{ color: "var(--mut)" }}> · {fechaBonita(p.fecha)}</span>
                      {dif !== null && dif != 0 && (
                        <span className={`dif ${dif < 0 ? "baja" : "sube"}`}>{dif > 0 ? "+" : ""}{dif}</span>
                      )}
                    </span>
                    <button className="x" aria-label={`borrar pesaje del ${p.fecha}`} onClick={() => borrarPeso(p.fecha)}>✕</button>
                  </div>
                );
              })}
            </div>
          </>
        )}

        {/* ================= CALENDARIO ================= */}
        {tab === "progreso" && (
          <>
            <h2 className="titulo">Calendario</h2>

            <div className="card rachaBig">
              <div className="rachaNum">{rachas.actual}<em>·</em></div>
              <div className="numL">Días de racha actual</div>
              <div className="statGrid" style={{ marginTop: 18 }}>
                <div><div className="num">{rachas.mejor}</div><div className="numL">Mejor racha</div></div>
                <div><div className="num">{rachas.total}</div><div className="numL">Días totales</div></div>
              </div>
            </div>

            <div className="card">
              <div className="calHead">
                <button className="nav" aria-label="mes anterior" onClick={() => setMesCal(({ y, m }) => m === 0 ? { y: y - 1, m: 11 } : { y, m: m - 1 })}>‹</button>
                <div className="calMes">{MESES[mesCal.m]} {mesCal.y}</div>
                <button className="nav" aria-label="mes siguiente" onClick={() => setMesCal(({ y, m }) => m === 11 ? { y: y + 1, m: 0 } : { y, m: m + 1 })}>›</button>
              </div>
              <div className="calGrid">
                {["D", "L", "M", "M", "J", "V", "S"].map((l, i) => <div className="calDiaL" key={i}>{l}</div>)}
                {celdas.map((f, i) => f === null
                  ? <div className="celda vacia" key={i} />
                  : (
                    <button key={f}
                      className={`celda ${data.diasMarcados.includes(f) ? "marcado" : ""} ${f === hoyISO() ? "esHoy" : ""} ${f > hoyISO() ? "futuro" : ""}`}
                      onClick={() => toggleDiaCal(f)}
                      aria-label={`${f}${data.diasMarcados.includes(f) ? ", entrenado" : ""}`}>
                      {parseInt(f.slice(-2), 10)}
                    </button>
                  ))}
              </div>
              <div className="tip" style={{ marginTop: 12 }}>
                Toca cualquier día para marcarlo o corregirlo · <strong style={{ color: "var(--blueHi)" }}>{rachas.esteMes} días</strong> entrenados en {MESES[mesCal.m]}.
              </div>
            </div>

            {/* ---- ESTADÍSTICAS ---- */}
            <h2 className="titulo" style={{ marginTop: 24 }}>Estadísticas</h2>

            <div className="card">
              <div className="numL" style={{ marginBottom: 12, marginTop: 0 }}>Tu regreso en números</div>
              <div className="statGrid">
                <div>
                  <div className="num">{estad.ritmo != null ? estad.ritmo.toFixed(1) : "—"}</div>
                  <div className="numL">Días / semana en promedio</div>
                </div>
                <div>
                  <div className="num">{estad.constancia != null ? Math.round(estad.constancia) + "%" : "—"}</div>
                  <div className="numL">Constancia desde el inicio</div>
                </div>
              </div>
              <div className="statGrid" style={{ marginTop: 16 }}>
                <div>
                  <div className="num" style={{ fontSize: 20 }}>{estad.mejorMes ? `${mesLabel(estad.mejorMes.mes)} · ${estad.mejorMes.dias}` : "—"}</div>
                  <div className="numL">Mejor mes (días entrenados)</div>
                </div>
                <div>
                  <div className="num" style={{ fontSize: 20, color: estad.ritmoPeso != null && estad.ritmoPeso < 0 ? "var(--ok)" : "var(--txt)" }}>
                    {estad.ritmoPeso != null ? `${estad.ritmoPeso > 0 ? "+" : ""}${estad.ritmoPeso.toFixed(2)} kg` : "—"}
                  </div>
                  <div className="numL">Cambio de peso / semana</div>
                </div>
              </div>
              {estad.diasDesde != null && (
                <div className="tip" style={{ marginTop: 14 }}>
                  Llevas <strong style={{ color: "var(--blueHi)" }}>{estad.diasDesde} días</strong> desde tu primer entrenamiento registrado, con <strong style={{ color: "var(--blueHi)" }}>{data.diasMarcados.length} sesiones</strong> en total.
                </div>
              )}
            </div>

            <div className="card">
              <div className="numL" style={{ marginBottom: 12, marginTop: 0 }}>Mes a mes</div>
              {estad.porMes.length === 0 && <div className="tip">Marca tu primer día y registra tu primer pesaje — aquí se escribirá tu historia mes a mes.</div>}
              {[...estad.porMes].reverse().map((m) => (
                <div className="mesRow" key={m.mes}>
                  <div className="mesTop">
                    <span className="mesNombre">{mesLabel(m.mes)}</span>
                    <span className="mesDias">{m.dias} {m.dias === 1 ? "día" : "días"}</span>
                    <span className="mesPeso">
                      {m.prom != null ? `${m.prom.toFixed(1)} kg prom` : "sin pesajes"}
                      {m.cambio != null && (
                        <span className={`dif ${m.cambio < 0 ? "baja" : m.cambio > 0 ? "sube" : ""}`} style={{ marginLeft: 6 }}>
                          {m.cambio > 0 ? "+" : ""}{m.cambio.toFixed(1)}
                        </span>
                      )}
                    </span>
                  </div>
                  <div className="mesBarra"><div className="mesBarraFill" style={{ width: `${(m.dias / estad.maxDias) * 100}%` }} /></div>
                </div>
              ))}
              {estad.porMes.length > 1 && (
                <div className="tip" style={{ marginTop: 12 }}>
                  El cambio de peso de cada mes se calcula con el <strong style={{ color: "var(--txt)" }}>promedio mensual</strong> — la medida más honesta, inmune a los brincos diarios de la báscula.
                </div>
              )}
            </div>
          </>
        )}

        {/* ================= DATOS ================= */}
        {tab === "respaldo" && (
          <>
            <h2 className="titulo">Datos</h2>

            <div className="card">
              <div className="listaRow"><span className="listaIco" style={{ background: "#16233C", color: "#6E99E8" }}>📅</span><span>Días entrenados</span><strong>{data.diasMarcados.length}</strong></div>
              <div className="listaRow"><span className="listaIco" style={{ background: "#14251E", color: "#58B08C" }}>⚖️</span><span>Pesajes</span><strong>{data.pesoCorporal.length}</strong></div>
              <div className="listaRow" style={{ color: "var(--mut)" }}><span className="listaIco" style={{ background: "var(--panel2)", color: "var(--mut)" }}>💾</span><span>Tamaño del respaldo</span><strong style={{ color: "var(--mut)" }}>{Math.max(1, Math.round(new Blob([armarRespaldo()]).size / 1024))} KB</strong></div>
            </div>

            <div className="secLabel">Guardar respaldo</div>
            <p className="secTxt">Toca el botón, abre tu app de <strong style={{ color: "var(--txt)" }}>Notas</strong> y pega. Ese texto es tu copia de seguridad completa.</p>
            <button className="btnGhost" onClick={copiarRespaldo}>
              <span style={{ color: "var(--ok)" }}>📋 Copiar respaldo para pegar en Notas</span>
            </button>

            <div className="secLabel">Restaurar respaldo</div>
            <p className="secTxt">Copia el texto de tu nota de respaldo y toca el botón para recuperar todos tus datos.</p>
            <button className="btnGhost" onClick={pegarYRestaurar}>
              <span style={{ color: "var(--blueHi)" }}>📥 Pegar respaldo y restaurar</span>
            </button>

            {pegadoManual && (
              <div className="card" style={{ marginTop: 14 }}>
                <div className="tip" style={{ marginBottom: 8 }}>Pega aquí el texto de tu respaldo:</div>
                <textarea
                  value={importTxt}
                  onChange={(e) => setImportTxt(e.target.value)}
                  placeholder='Pega aquí tu respaldo (empieza con { ... )'
                  aria-label="pegar texto de respaldo"
                />
                <div style={{ height: 10 }} />
                <button className="btn grande" onClick={() => importTxt.trim() && validarYRestaurar(importTxt)}>Restaurar datos</button>
              </div>
            )}

            <div className="nota">
              💾 Guarda el respaldo en una nota de tu teléfono. Pase lo que pase, solo copias ese texto, tocas "Pegar respaldo y restaurar" y recuperas todo.
            </div>
          </>
        )}
      </main>

      <nav className="tabs" aria-label="secciones">
        {[["hoy", "Hoy"], ["peso", "Peso"], ["progreso", "Calendario"], ["respaldo", "Datos"]].map(([k, l]) => (
          <button key={k} className={`tab ${tab === k ? "on" : ""}`} onClick={() => setTab(k)}>
            {l}
            {k === "peso" && pesajePendiente && <span className="tabDot" aria-label="pesaje pendiente" />}
          </button>
        ))}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ErrorBoundary><ModoBestia /></ErrorBoundary>);

  </script>
</body>
</html>
